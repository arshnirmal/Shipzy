name: shipzy_driver
description: Shipzy - Hyperlocal Delivery Driver App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  mapbox_maps_flutter: ^2.11.0
  geolocator: ^13.0.2
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  flutter_svg: ^2.0.17
  intl: ^0.19.0
  logger: ^2.5.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  riverpod_annotation: ^2.6.1
  device_info_plus: ^11.2.0
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.3.3
  firebase_messaging: ^15.2.4
  flutter_foreground_task: ^8.15.0
  sqflite: ^2.4.1
  path: ^1.9.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^17.2.0
  battery_plus: ^6.0.1
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.4.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/mapbox/
    - .env
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-Bold.ttf
          weight: 700
