<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shipzy Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen w-full flex-col items-center justify-between overflow-hidden bg-background-light dark:bg-background-dark p-8">
<!-- Top spacer for layout balance -->
<div class="h-12 w-full"></div>
<!-- Center Content: Logo and Branding -->
<div class="flex flex-col items-center justify-center space-y-6">
<!-- Stylized Icon Container -->
<div class="relative flex items-center justify-center w-24 h-24 bg-primary/10 dark:bg-primary/20 rounded-xl">
<span class="material-symbols-outlined text-primary text-6xl" data-icon="bolt">
                    bolt
                </span>
<!-- Subtle decorative background element -->
<div class="absolute inset-0 bg-primary/5 rounded-xl rotate-6 -z-10"></div>
</div>
<!-- Brand Name and Tagline -->
<div class="text-center">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-bold tracking-tight mb-2">
                    Shipzy
                </h1>
<p class="text-slate-500 dark:text-slate-400 text-lg font-medium">
                    Fast local delivery
                </p>
</div>
</div>
<!-- Bottom Content: Loading State -->
<div class="flex flex-col items-center gap-6 w-full max-w-xs pb-12">
<!-- Circular Loading Spinner -->
<div class="relative w-10 h-10">
<div class="absolute inset-0 border-2 border-primary/20 rounded-full"></div>
<div class="absolute inset-0 border-2 border-primary border-t-transparent rounded-full animate-spin"></div>
</div>
<!-- Status Text -->
<p class="text-slate-400 dark:text-slate-500 text-sm font-medium tracking-wide uppercase">
                Initializing...
            </p>
<!-- Optional Progress Bar (as per component reference) -->
<div class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full"></div>
</div>
</div>
<!-- Background Decor: HeaderImage Style Reference -->
<div class="absolute inset-0 pointer-events-none opacity-5 dark:opacity-10 -z-10">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Abstract aerial view of city streets at night" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCyQ_Q0ujhBkZUAPn8UvPhhh16N2qdsJzITNr1odl2s8QQ84k72fVWIqNtLHV9ZneylD8KC2S0zx8Yl0wU5UzMr_WObj1FXykXV7KAvH6O_wwPGM_pDwaj2g0WPCiSDiKJdxL0y86eBpVqRHfRICyHZb2QdrGpN4igyWAev5Nbbiutz67HyEVFylPqD7ahsa3HbBMD9HTKomW_Ya99nj_LSbRMM_1r3TymxxOM_gOVXuMdE3Zjd29tP_2AISaCz_abBzzOwh1D_J4A");'>
</div>
</div>
</div>
</body></html>
