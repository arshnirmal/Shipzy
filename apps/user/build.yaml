targets:
  $default:
    builders:
      riverpod_generator:
        generate_for:
          - lib/**/*.dart
        options:
          # Riverpod generator options

      json_serializable:
        generate_for:
          - lib/**/*.dart
        options:
          explicit_to_json: true

      retrofit_generator:
        generate_for:
          - lib/**/*.dart
        options:
          # Retrofit options
