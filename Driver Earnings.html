/* ─── Formatters ─────────────────────────────────────────── */
const fmt = (n) => {
  if(n >= 100000) return '₹' + (n/100000).toFixed(1) + 'L';
  if(n >= 1000)   return '₹' + (n/1000).toFixed(n%1000===0?0:1) + 'K';
  return '₹' + Math.round(n);
};
const fmtFull = (n) => '₹' + n.toLocaleString('en-IN');
const fmtDelta = (curr, prev) => {
  const d = Math.round(((curr-prev)/prev)*100);
  return {pct: Math.abs(d), up: d >= 0};
};

/* ─── Period Tabs ────────────────────────────────────────── */
function PeriodTabs({active, onChange}){
  const tabs = ['today','week','month','year'];
  const labels = {today:'Today', week:'Week', month:'Month', year:'Year'};
  return (
    <div style={{
      display:'flex',gap:4,
      background:DS.surfaceLow,
      borderRadius:12,padding:4,
      margin:'0 20px 20px',
    }}>
      {tabs.map(t=>{
        const sel = active===t;
        return (
          <button key={t} onClick={()=>onChange(t)} style={{
            flex:1,height:34,borderRadius:9,border:'none',
            background: sel ? DS.surface : 'transparent',
            cursor:'pointer',
            fontSize:12,fontWeight: sel?800:600,
            color: sel ? DS.primary : DS.onSurfaceVar,
            letterSpacing:'0.01em',
            fontFamily:'Plus Jakarta Sans,sans-serif',
            boxShadow: sel ? `0 1px 4px rgba(70,72,212,0.12)` : 'none',
            transition:'all 0.2s',
          }}>{labels[t]}</button>
        );
      })}
    </div>
  );
}

/* ─── Bar Chart ──────────────────────────────────────────── */
function EarningsChart({bars, barLabel, period}){
  const [activeBar, setActiveBar] = React.useState(null);
  const maxVal = Math.max(...bars.map(b=>b.value), 1);
  const chartH = 96;

  // animate key change
  const [animKey, setAnimKey] = React.useState(0);
  React.useEffect(()=>{ setAnimKey(k=>k+1); setActiveBar(null); }, [period]);

  return (
    <div style={{
      margin:'0 20px 16px',
      background:DS.surface,
      borderRadius:16,padding:'16px 16px 12px',
      boxShadow:`0 1px 0 ${DS.ghost}`,
      animation:'fadeSlideUp 0.4s ease',
    }}>
      {/* header */}
      <div style={{
        display:'flex',alignItems:'center',justifyContent:'space-between',
        marginBottom:14,
      }}>
        <div style={{fontSize:12,fontWeight:700,color:DS.onSurface,letterSpacing:'-0.01em'}}>
          {barLabel} breakdown
        </div>
        {activeBar !== null && bars[activeBar].value > 0 && (
          <div style={{
            fontSize:12,fontWeight:800,color:DS.primary,
            animation:'fadeIn 0.2s ease',
          }}>
            {fmt(bars[activeBar].value)} · {bars[activeBar].label}
          </div>
        )}
      </div>

      {/* bars */}
      <div style={{
        display:'flex',alignItems:'flex-end',
        gap: bars.length > 8 ? 3 : 5,
        height:chartH,
      }}>
        {bars.map((bar, i)=>{
          const heightPct = bar.value > 0 ? Math.max((bar.value/maxVal)*100, 6) : 0;
          const isActive = activeBar===i;
          const isEmpty  = bar.value===0;
          return (
            <div
              key={i+'-'+animKey}
              onClick={()=>setActiveBar(isActive ? null : i)}
              style={{
                flex:1,display:'flex',flexDirection:'column',
                alignItems:'center',gap:4,cursor: isEmpty?'default':'pointer',
              }}
            >
              <div style={{
                width:'100%',height:chartH,
                display:'flex',alignItems:'flex-end',
              }}>
                <div style={{
                  width:'100%',
                  height: isEmpty ? 4 : `${heightPct}%`,
                  borderRadius: isEmpty?2:4,
                  background: isEmpty
                    ? DS.surfaceHigh
                    : isActive
                      ? DS.primaryGrad
                      : `linear-gradient(180deg,${DS.primaryLight} 0%,${DS.primaryLight} 100%)`,
                  opacity: isEmpty ? 0.5 : 1,
                  transition:'height 0.4s cubic-bezier(0.34,1.2,0.64,1), background 0.2s',
                  transformOrigin:'bottom',
                  animation: !isEmpty ? `growBar 0.5s cubic-bezier(0.34,1.2,0.64,1) ${i*0.04}s both` : 'none',
                  position:'relative',
                }}>
                  {/* active top dot */}
                  {isActive && !isEmpty && (
                    <div style={{
                      position:'absolute',top:-4,left:'50%',
                      transform:'translateX(-50%)',
                      width:6,height:6,borderRadius:3,
                      background:DS.primary,
                    }}/>
                  )}
                </div>
              </div>
              <div style={{
                fontSize: bars.length > 8 ? 8 : 9,
                fontWeight:700,
                color: isActive ? DS.primary : DS.onSurfaceVar,
                letterSpacing:'0.02em',textTransform:'uppercase',
                lineHeight:1,
              }}>{bar.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

  return (
    <div style={{

        <div key={i} style={{

          <div style={{
            width:32,height:32,borderRadius:9,

            {c.icon}

/* ─── Goal Progress ──────────────────────────────────────── */
function GoalCard({data, onEditGoal}){
  const {earning, goalAmount, label} = data;
  const pct = Math.min(earning/goalAmount, 1);
  const reached = pct >= 1;
  const remaining = Math.max(goalAmount - earning, 0);

  // ring
  const R = 28, circ = 2*Math.PI*R;
  const ringColor = reached ? DS.tertiaryAlt : pct>=0.7 ? DS.amber : DS.primary;

  return (
    <div style={{
      margin:'0 20px 16px',
      background:DS.surface,
      borderRadius:16,padding:'16px 18px',
      boxShadow:`0 1px 0 ${DS.ghost}`,
      display:'flex',alignItems:'center',gap:16,
      animation:'fadeSlideUp 0.4s ease',
    }}>
      {/* ring */}
      <div style={{position:'relative',flexShrink:0,width:68,height:68}}>
        <svg width="68" height="68" style={{transform:'rotate(-90deg)'}}>
          <circle cx="34" cy="34" r={R} fill="none" stroke={DS.surfaceHigh} strokeWidth="5"/>
          <circle cx="34" cy="34" r={R} fill="none"
            stroke={ringColor} strokeWidth="5" strokeLinecap="round"
            strokeDasharray={circ}
            strokeDashoffset={circ*(1-pct)}
            style={{transition:'stroke-dashoffset 0.7s cubic-bezier(0.34,1.2,0.64,1), stroke 0.4s'}}
          />
        </svg>
        <div style={{
          position:'absolute',inset:0,
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
        }}>
          <div style={{fontSize:14,fontWeight:800,color: reached?DS.tertiary:DS.onSurface,letterSpacing:'-0.02em',lineHeight:1}}>{Math.round(pct*100)}%</div>
          {reached && <div style={{fontSize:8,fontWeight:700,color:DS.tertiary,letterSpacing:'0.04em'}}>DONE!</div>}
        </div>
      </div>

      {/* text */}
      <div style={{flex:1,minWidth:0}}>
        <div style={{
          fontSize:10,fontWeight:800,letterSpacing:'0.07em',
          color:DS.onSurfaceVar,textTransform:'uppercase',marginBottom:4,
        }}>
          {label==='Today'?'Daily':label==='This Week'?'Weekly':label==='This Month'?'Monthly':'Yearly'} Goal
        </div>
        <div style={{
          fontSize:16,fontWeight:800,color:DS.onSurface,
          letterSpacing:'-0.02em',marginBottom:3,
        }}>{fmtFull(earning)} <span style={{fontSize:12,fontWeight:600,color:DS.onSurfaceVar}}>/ {fmtFull(goalAmount)}</span></div>
        <div style={{fontSize:11,fontWeight:500,color: reached?DS.tertiary:DS.onSurfaceVar}}>
          {reached
            ? '🎉 Goal reached! Great work today.'
            : `${fmtFull(remaining)} more to hit your goal`}
        </div>
      </div>

      {/* edit */}
      <button onClick={onEditGoal} style={{
        width:32,height:32,borderRadius:8,border:'none',
        background:DS.surfaceLow,cursor:'pointer',flexShrink:0,
        display:'flex',alignItems:'center',justifyContent:'center',
      }}>
        <Ico.Edit c={DS.onSurfaceVar} sz={14}/>
      </button>
    </div>
  );
}

/* ─── Recent Trips ───────────────────────────────────────── */
function RecentTrips({trips}){
  return (
    <div style={{margin:'0 20px 24px'}}>
      <div style={{
        display:'flex',alignItems:'center',justifyContent:'space-between',
        marginBottom:12,
      }}>
        <div style={{
          fontSize:12,fontWeight:700,color:DS.onSurface,letterSpacing:'-0.01em',
        }}>Recent Trips</div>
        <button style={{
          fontSize:11,fontWeight:700,color:DS.primary,
          background:'none',border:'none',cursor:'pointer',
          fontFamily:'Plus Jakarta Sans,sans-serif',letterSpacing:'0.02em',
        }}>View All →</button>
      </div>

      {trips.map((t,i)=>(
        <div key={t.order+i} style={{
          display:'flex',alignItems:'center',gap:12,
          padding:'11px 0',
          borderBottom: i<trips.length-1 ? `1px solid ${DS.ghost}` : 'none',
          animation:`fadeSlideUp 0.35s ease ${i*0.05}s both`,
        }}>
          {/* left dot */}
          <div style={{
            width:8,height:8,borderRadius:4,flexShrink:0,
            background: t.cancelled ? DS.error : DS.tertiary,
          }}/>

          {/* route + meta */}
          <div style={{flex:1,minWidth:0}}>
            <div style={{
              fontSize:13,fontWeight:700,color: t.cancelled?DS.onSurfaceVar:DS.onSurface,
              letterSpacing:'-0.01em',
              whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',
              textDecoration: t.cancelled?'line-through':'none',
            }}>{t.route}</div>
            <div style={{
              fontSize:10,fontWeight:600,color:DS.onSurfaceVar,
              letterSpacing:'0.02em',marginTop:1,
            }}>{t.order} · {t.time}</div>
          </div>

          {/* earning + tip */}
          <div style={{textAlign:'right',flexShrink:0}}>
            <div style={{
              fontSize:14,fontWeight:800,
              color: t.cancelled ? DS.onSurfaceVar : DS.primary,
              letterSpacing:'-0.02em',
            }}>{t.cancelled ? '—' : `₹${t.earning}`}</div>
            {t.tip > 0 && (
              <div style={{
                fontSize:9,fontWeight:700,color:DS.amber,letterSpacing:'0.03em',
              }}>+₹{t.tip} tip</div>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ─── Goal Edit Sheet ────────────────────────────────────── */
function GoalSheet({open, onClose, currentGoal, onSave}){
  const [val, setVal] = React.useState(String(currentGoal));
  React.useEffect(()=>{if(open) setVal(String(currentGoal));}, [open, currentGoal]);
  if(!open) return null;
  const presets = [300,500,1000,3000,5000,10000];
  return (
    <>
      <div onClick={onClose} style={{
        position:'absolute',inset:0,background:'rgba(27,27,35,0.45)',
        backdropFilter:'blur(2px)',zIndex:200,animation:'scrimIn 0.2s ease',
      }}/>
      <div style={{
        position:'absolute',bottom:0,left:0,right:0,zIndex:201,
        background:DS.surface,borderRadius:'20px 20px 0 0',
        padding:'10px 0 32px',
        animation:'slideUp 0.3s cubic-bezier(0.34,1.2,0.64,1)',
        boxShadow:'0 -8px 32px rgba(0,0,0,0.15)',
      }}>
        <div style={{display:'flex',justifyContent:'center',paddingBottom:14}}>
          <div style={{width:36,height:4,borderRadius:2,background:DS.surfaceHigh}}/>
        </div>
        <div style={{padding:'0 20px'}}>
          <div style={{fontSize:18,fontWeight:800,color:DS.onSurface,letterSpacing:'-0.02em',marginBottom:4}}>Set Goal</div>
          <div style={{fontSize:12,fontWeight:500,color:DS.onSurfaceVar,marginBottom:18}}>Choose how much you'd like to earn</div>

          {/* presets */}
          <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:18}}>
            {presets.map(p=>{
              const sel = String(p)===val;
              return (
                <button key={p} onClick={()=>setVal(String(p))} style={{
                  background: sel?DS.primary:DS.surfaceLow,
                  border:'none',borderRadius:20,padding:'8px 14px',cursor:'pointer',
                  fontSize:13,fontWeight:700,
                  color: sel?'#fff':DS.onSurface,
                  fontFamily:'Plus Jakarta Sans,sans-serif',
                  transition:'all 0.2s',
                }}>₹{p.toLocaleString('en-IN')}</button>
              );
            })}
          </div>

          {/* custom input */}
          <div style={{
            background:DS.surfaceLow,borderRadius:12,padding:'13px 16px',
            display:'flex',alignItems:'center',gap:8,marginBottom:20,
          }}>
            <span style={{fontSize:18,fontWeight:700,color:DS.onSurfaceVar}}>₹</span>
            <input
              type="number" value={val} onChange={e=>setVal(e.target.value)}
              placeholder="Custom amount"
              style={{
                flex:1,border:'none',outline:'none',background:'transparent',
                fontSize:16,fontWeight:700,color:DS.onSurface,
                fontFamily:'Plus Jakarta Sans,sans-serif',
                caretColor:DS.primary,
              }}
            />
          </div>

          <button onClick={()=>{onSave(Number(val)||currentGoal);onClose();}} style={{
            width:'100%',height:54,borderRadius:12,border:'none',
            background:DS.primaryGrad,
            fontSize:15,fontWeight:800,color:'#fff',
            cursor:'pointer',letterSpacing:'0.02em',
            fontFamily:'Plus Jakarta Sans,sans-serif',
            boxShadow:`0 6px 20px rgba(70,72,212,0.35)`,
          }}>Save Goal</button>
        </div>
      </div>
    </>
  );
}

/* ─── Bottom Nav ─────────────────────────────────────────── */
function BottomNav(){
  const tabs=[
    {id:'home',label:'Home',Icon:Ico.Home},
    {id:'earnings',label:'Earnings',Icon:Ico.Earnings},
    {id:'trips',label:'Trips',Icon:Ico.TripsNav},
    {id:'profile',label:'Profile',Icon:Ico.Profile},
  ];
  return (
    <div style={{
      position:'absolute',bottom:0,left:0,right:0,zIndex:50,
      background:'rgba(252,248,255,0.96)',
      backdropFilter:'blur(20px)',
      borderTop:`1px solid ${DS.surfaceHigh}`,
      display:'flex',height:70,paddingBottom:8,
    }}>
      {tabs.map(({id,label,Icon})=>{
        const active=id==='earnings';
        return (
          <div key={id} style={{
            flex:1,display:'flex',flexDirection:'column',
            alignItems:'center',justifyContent:'center',
            gap:3,cursor:active?'default':'pointer',paddingTop:8,
          }}>
            <Icon c={active?DS.primary:DS.onSurfaceVar} sz={22}/>
            <span style={{
              fontSize:10,fontWeight:active?700:500,
              color:active?DS.primary:DS.onSurfaceVar,letterSpacing:'0.03em',
            }}>{label}</span>
            {active && <div style={{width:4,height:4,borderRadius:2,background:DS.primary}}/>}
          </div>
        );
      })}
    </div>
  );
}

/* ─── App ────────────────────────────────────────────────── */
function App(){
  const [period, setPeriod] = React.useState(
    ()=>localStorage.getItem('earnings_period')||'week'
  );
  const [goalSheet, setGoalSheet] = React.useState(false);
  const [goals, setGoals] = React.useState({
    today:500, week:3500, month:12000, year:60000,
  });

  const changePeriod = (p) => {
    setPeriod(p);
    localStorage.setItem('earnings_period', p);
  };

  const data = {
    ...PERIODS[period],
    goalAmount: goals[period],
  };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}>
      <AndroidDevice width={390} height={844} dark={false}>
        <div style={{
          height:'100%',display:'flex',flexDirection:'column',
          background:DS.surfaceLow,
          fontFamily:'Plus Jakarta Sans,sans-serif',
          position:'relative',
        }}>
          {/* Header */}
          <div style={{
            padding:'8px 20px 0',background:DS.surface,
            display:'flex',alignItems:'center',gap:10,
          }}>
            <button style={{
              width:40,height:40,borderRadius:10,border:'none',
              background:DS.surfaceLow,cursor:'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',
            }}>
              <Ico.Back c={DS.onSurface} sz={20}/>
            </button>
            <h1 style={{
              flex:1,fontSize:22,fontWeight:800,color:DS.onSurface,
              letterSpacing:'-0.02em',
            }}>Earnings</h1>
            <div style={{
              fontSize:11,fontWeight:700,color:DS.onSurfaceVar,
              background:DS.surfaceLow,borderRadius:8,padding:'5px 10px',
              letterSpacing:'0.02em',
            }}>Rohit K.</div>
          </div>

          {/* Period tabs */}
          <div style={{background:DS.surface,paddingTop:12}}>
            <PeriodTabs active={period} onChange={changePeriod}/>
          </div>

          {/* Scrollable content */}
          <div className="scroll-area" style={{
            flex:1,overflow:'auto',paddingBottom:80,paddingTop:4,
          }}>
            <HeroCard data={data}/>
            <EarningsChart bars={data.bars} barLabel={data.barLabel} period={period}/>
            <StatCards data={data}/>
            <GoalCard data={data} onEditGoal={()=>setGoalSheet(true)}/>
            <RecentTrips trips={data.recentTrips}/>
          </div>

          <BottomNav/>

          <GoalSheet
            open={goalSheet}
            onClose={()=>setGoalSheet(false)}
            currentGoal={goals[period]}
            onSave={(v)=>setGoals(g=>({...g,[period]:v}))}
          />
        </div>
      </AndroidDevice>

      <div style={{
        position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',
        background:'rgba(255,255,255,0.07)',backdropFilter:'blur(12px)',
        borderRadius:20,padding:'8px 20px',
        fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.45)',
        letterSpacing:'0.05em',border:'1px solid rgba(255,255,255,0.1)',
        whiteSpace:'nowrap',
      }}>
        SHIPZY · EARNINGS · Tap period tabs · Tap bars · Edit goal ✏
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
