name: Backend CI

on:
    push:
        branches: [main]
        paths:
            - "services/backend/**"
    pull_request:
        branches: [main]
        paths:
            - "services/backend/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: services/backend/package-lock.json

            - name: Install dependencies
              working-directory: ./services/backend
              run: npm ci

            - name: Run tests
              working-directory: ./services/backend
              run: npm test

            - name: Build
              working-directory: ./services/backend
              run: npm run build

    deploy:
        needs: test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
        # Add deployment steps here, e.g., to DigitalOcean
