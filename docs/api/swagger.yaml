          example: true

    OrderStatus:
      type: object
      properties:
        statusId:
          type: integer
          example: 1
        name:
          type: string
          example: "pending"
        description:
          type: string
          example: "Order created, awaiting driver assignment"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/firebase/verify
