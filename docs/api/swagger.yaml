openapi: 3.0.0
info:
  title: Shipzy API
  description: API for the Shipzy ride-sharing platform
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local server
paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /orders:
    post:
      summary: Create a new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    get:
      summary: Get user's orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
components:
  schemas:
    User:
      $ref: "../packages/shared-types/user.types.ts#/User"
    CreateUserRequest:
      $ref: "../packages/shared-types/user.types.ts#/CreateUserRequest"
    LoginRequest:
      $ref: "../packages/shared-types/user.types.ts#/LoginRequest"
    AuthResponse:
      $ref: "../packages/shared-types/user.types.ts#/AuthResponse"
    Order:
      $ref: "../packages/shared-types/order.types.ts#/Order"
    CreateOrderRequest:
      $ref: "../packages/shared-types/order.types.ts#/CreateOrderRequest"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
