/* ─── Progress Ring ───────────────────────────────────────── */
function ProgressRing({earned, goal, size=72}){
  const R = (size-8)/2;
  const circ = 2*Math.PI*R;
  const pct = Math.min(earned/goal, 1);
  const offset = circ*(1-pct);
  // color: green when done, amber when close (>70%), white otherwise
  const strokeColor = pct>=1 ? '#89f8c3' : pct>=0.7 ? '#ffd77a' : 'rgba(255,255,255,0.9)';
  return (
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        {/* track */}
        <circle cx={size/2} cy={size/2} r={R}
          fill="none" stroke="rgba(255,255,255,0.15)" strokeWidth="5"/>
        {/* progress */}
        <circle cx={size/2} cy={size/2} r={R}
          fill="none" stroke={strokeColor} strokeWidth="5"
          strokeLinecap="round"
          strokeDasharray={circ}
          strokeDashoffset={offset}
          style={{transition:'stroke-dashoffset 0.6s ease, stroke 0.4s ease'}}
        />
      </svg>
      {/* centre text */}
      <div style={{
        position:'absolute',inset:0,
        display:'flex',flexDirection:'column',
        alignItems:'center',justifyContent:'center',
        gap:0,
      }}>
        <div style={{fontSize:13,fontWeight:800,color:'#fff',lineHeight:1,letterSpacing:'-0.02em'}}>
          {Math.round(pct*100)}%
        </div>
        <div style={{fontSize:8,fontWeight:700,color:'rgba(255,255,255,0.6)',letterSpacing:'0.04em',textTransform:'uppercase',marginTop:1}}>goal</div>
      </div>
    </div>
  );
}

/* ─── Earning color by performance (avg = ₹174) ───────────── */
const AVG_EARNING = 174;
function earningColor(net){
  if(net <= 0)            return DS.onSurfaceVar;
  if(net >= AVG_EARNING * 1.15) return DS.tertiary;      // ≥15% above avg → green
  if(net >= AVG_EARNING * 0.85) return DS.primary;       // within ±15% → indigo
  return DS.amber;                                        // below → amber
}

/* ─── Trip Card ───────────────────────────────────────────── */
function TripCard({trip, onTap, idx}){
  const cfg     = STATUS[trip.status];
  const eColor  = earningColor(trip.netEarning);
  const pkgIcon = PKG_ICON[trip.package] || PKG_ICON['Small parcel'];
  const hasTip  = trip.tip > 0;

  // Clock-only — strip day prefix, keep only "HH:MM AM/PM"
  const rawTime = trip.deliveredAt || trip.cancelledAt || trip.returnedAt || '';
  const timeTokens = rawTime.trim().split(' ');
  const timeStr = timeTokens.length >= 2 ? timeTokens.slice(-2).join(' ') : rawTime;

  // Round earning for compact display on card (show decimals only if < ₹10)
  const earningDisplay = trip.netEarning <= 0
    ? '—'
    : trip.netEarning < 10
      ? fmtINR(trip.netEarning)
      : '₹' + Math.round(trip.netEarning);

  const [pressed, setPressed] = React.useState(false);

/* ─── Pull-to-refresh indicator ───────────────────────────── */
function PullIndicator({pull,refreshing}){
  const r = Math.min(pull/80, 1);
  const visible = pull>0 || refreshing;
  return (
    <div style={{
      position:'absolute',top:Math.min(pull*0.5, 32)-30,left:'50%',
      transform:`translateX(-50%)`,
      opacity: visible?1:0,
      transition: refreshing?'none':'opacity 0.2s',
      zIndex:5,
    }}>
      <div style={{
        width:34,height:34,borderRadius:17,
        background:DS.surface,boxShadow:`0 4px 12px rgba(70,72,212,0.18)`,
        display:'flex',alignItems:'center',justifyContent:'center',
        transform: refreshing?'rotate(0)':`rotate(${r*360}deg)`,
        animation: refreshing ? 'spin 0.7s linear infinite' : 'none',
      }}>
        <Ico.Refresh c={DS.primary} sz={18}/>
      </div>
    </div>
  );
}

/* ─── List Screen ─────────────────────────────────────────── */
function ListScreen({onTripTap, onFilter, filter, dateRange}){
  const [refreshing, setRefreshing] = React.useState(false);
  const [pull, setPull] = React.useState(0);
  const [loading, setLoading] = React.useState(true);
  const startY = React.useRef(0);
  const scrollRef = React.useRef(null);

  React.useEffect(()=>{
    const t = setTimeout(()=>setLoading(false), 900);
    return ()=>clearTimeout(t);
  },[]);

  // Filter
  const filtered = TRIPS.filter(t => filter==='all' || t.status===filter);
  const counts = {
    all: TRIPS.length,
    delivered: TRIPS.filter(t=>t.status==='delivered').length,
    cancelled: TRIPS.filter(t=>t.status==='cancelled').length,
    returned: TRIPS.filter(t=>t.status==='returned').length,
  };

  // Group by date
  const grouped = filtered.reduce((acc,t)=>{
    if(!acc[t.dateGroup]) acc[t.dateGroup] = {label:t.dateLabel, items:[]};
    acc[t.dateGroup].items.push(t);
    return acc;
  }, {});
  const groupOrder = ['today','yesterday','week','earlier'];

  // pull to refresh
  const onTouchStart = (e) => {
    if(scrollRef.current?.scrollTop===0) startY.current = e.touches[0].clientY;
  };
  const onTouchMove = (e) => {
    if(refreshing) return;
    if(scrollRef.current?.scrollTop===0 && startY.current){
      const delta = e.touches[0].clientY - startY.current;
      if(delta>0) setPull(Math.min(delta, 100));
    }
  };
  const onTouchEnd = () => {
    if(pull>=80){
      setRefreshing(true);
      setPull(60);
      setTimeout(()=>{ setRefreshing(false); setPull(0);}, 1100);
    } else {
      setPull(0);
    }
    startY.current = 0;
  };

  // dev simulate refresh button
  const simRefresh = () => {
    setRefreshing(true); setPull(60);
    setTimeout(()=>{ setRefreshing(false); setPull(0);}, 1100);
  };

  const hasResults = filtered.length>0;

  return (
    <div style={{
      height:'100%',display:'flex',flexDirection:'column',
      background:DS.surface,position:'relative',
    }}>
      <Header onBack={()=>{}} hasFilters={dateRange!=='week'} onFilter={onFilter}/>

      <div
        ref={scrollRef}
        className="scroll-area"
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{
          flex:1,overflow:'auto',position:'relative',
          paddingBottom:24,
        }}
      >
        <PullIndicator pull={pull} refreshing={refreshing}/>

        <div style={{
          transform:`translateY(${refreshing?40:pull*0.5}px)`,
          transition: refreshing?'transform 0.25s':(pull>0?'none':'transform 0.25s'),
        }}>
          <SummaryHeader/>
          <FilterChips active={filter} onChange={onFilter} counts={counts}/>

          <div style={{padding:'0 16px'}}>
            {loading ? (
              <>
                <GroupHeader label="Loading…" count={'·'}/>
                {[0,1,2].map(i=><SkeletonCard key={i}/>)}
              </>
            ) : !hasResults ? (
              <EmptyState filter={filter}/>
            ) : (
              groupOrder.map(g=>{
                if(!grouped[g]) return null;
                return (
                  <div key={g}>
                    <GroupHeader label={grouped[g].label} count={grouped[g].items.length}/>
                    {grouped[g].items.map((t,i)=>(
                      <TripCard key={t.id} trip={t} idx={i} onTap={()=>onTripTap(t)}/>
                    ))}
                  </div>
                );
              })
            )}
          </div>
        </div>
      </div>

      {/* dev refresh button — pinned to header area, not over list */}
      <button onClick={simRefresh} style={{
        position:'absolute',top:10,right:64,zIndex:10,
        background:DS.surfaceLow,border:`1px solid ${DS.surfaceHigh}`,
        borderRadius:8,padding:'5px 9px',cursor:'pointer',
        fontSize:9,fontWeight:700,color:DS.primary,letterSpacing:'0.04em',
        fontFamily:'Plus Jakarta Sans,sans-serif',
      }}>↓ REFRESH</button>
    </div>
  );
}

          <div style={{
            width:44,height:44,borderRadius:10,
            background:DS.primaryLight,
            display:'flex',alignItems:'center',justifyContent:'center',
            flexShrink:0,
          }}>
            <Ico.Pkg c={DS.primary} sz={20}/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontSize:10,fontWeight:700,color:DS.onSurfaceVar,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:2}}>Package</div>
            <div style={{fontSize:14,fontWeight:800,color:DS.onSurface}}>{trip.package}</div>
            <div style={{fontSize:11,color:DS.onSurfaceVar,fontWeight:500,marginTop:1}}>{trip.weight} · {trip.vehicle}</div>
          </div>
        </div>

        {/* Timeline */}
        <div style={{
          margin:'0 16px 12px',background:DS.surface,
          borderRadius:16,padding:'18px 20px',
          boxShadow:`0 1px 0 ${DS.ghostLine}`,
        }}>
          <div style={{
            fontSize:10,fontWeight:800,letterSpacing:'0.08em',
            color:DS.onSurfaceVar,textTransform:'uppercase',marginBottom:14,
          }}>Timeline</div>
          {timelineSteps.map((step,i,arr)=>{
            const isLast = i===arr.length-1;
            const finalCfg = step.isFinal ? cfg : null;
            const dotBg = step.skipped ? DS.surfaceHigh
                        : finalCfg ? finalCfg.bar
                        : step.done ? DS.primary
                        : DS.surfaceHigh;
            return (
              <div key={i} style={{display:'flex',gap:14}}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}>
                  <div style={{
                    width:22,height:22,borderRadius:11,
                    background: dotBg,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    flexShrink:0,
                    boxShadow: step.done && !step.skipped ? `0 0 0 3px ${
                      finalCfg ? finalCfg.bg : DS.primaryLight
                    }` : 'none',
                  }}>
                    {step.done && !step.skipped && <Ico.Check c="#fff" sz={11}/>}
                  </div>
                  {!isLast && (
                    <div style={{
                      width:1.5,flex:1,minHeight:30,
                      background: step.done&&!step.skipped ? DS.primaryLight : DS.surfaceHigh,
                      margin:'2px 0',
                    }}/>
                  )}
                </div>
                <div style={{paddingBottom:isLast?0:18,flex:1}}>
                  <div style={{
                    fontSize:13,fontWeight:800,
                    color: step.skipped ? DS.onSurfaceVar : DS.onSurface,
                    textDecoration: step.skipped?'line-through':'none',
                    letterSpacing:'-0.01em',
                  }}>{step.label}</div>
                  <div style={{fontSize:11,color:DS.onSurfaceVar,fontWeight:500,marginTop:2}}>
                    {step.skipped ? 'Skipped' : (step.time || '—')}
                  </div>
                </div>
              </div>
            );
          })}
          {trip.cancellationReason && (
            <div style={{
              marginTop:6,padding:'10px 12px',
              background:cfg.bg,borderRadius:10,
              fontSize:12,fontWeight:600,color:cfg.fg,lineHeight:1.45,
            }}>
              <strong style={{fontWeight:800}}>Reason: </strong>{trip.cancellationReason}
            </div>
          )}
        </div>

        {/* Earnings breakdown */}
        {trip.netEarning>0 && (
          <div style={{
            margin:'0 16px 12px',background:DS.surface,
            borderRadius:16,padding:'18px 20px',
            boxShadow:`0 1px 0 ${DS.ghostLine}`,
          }}>
            <div style={{
              fontSize:10,fontWeight:800,letterSpacing:'0.08em',
              color:DS.onSurfaceVar,textTransform:'uppercase',marginBottom:12,
            }}>Earnings Breakdown</div>
            {[
              {label:'Base fare', value:trip.baseFare},
              {label:`Distance · ${trip.distanceKm} km`, value:trip.distanceFee},
              {label:'Tip', value:trip.tip},
            ].map(row=>(
              <div key={row.label} style={{
                display:'flex',justifyContent:'space-between',alignItems:'center',
                padding:'10px 0',
              }}>
                <div style={{fontSize:13,fontWeight:600,color:DS.onSurface}}>{row.label}</div>
                <div style={{fontSize:14,fontWeight:700,color:DS.onSurface}}>{fmtINR(row.value)}</div>
              </div>
            ))}
            <div style={{height:1,background:DS.ghostLine,margin:'8px 0'}}/>
            <div style={{
              display:'flex',justifyContent:'space-between',alignItems:'center',
              padding:'10px 0 0',
            }}>
              <div style={{fontSize:13,fontWeight:800,color:DS.onSurface,letterSpacing:'0.02em'}}>Net Earning</div>
              <div style={{fontSize:18,fontWeight:800,color:DS.primary,letterSpacing:'-0.02em'}}>{fmtINR(trip.netEarning)}</div>
            </div>
          </div>
        )}

        {/* Help button */}
        <div style={{margin:'8px 16px 0'}}>
          <button onClick={()=>onShowSnack('Help request sent (demo)')} style={{
            width:'100%',height:54,borderRadius:14,border:'none',
            background:DS.surface,
            display:'flex',alignItems:'center',justifyContent:'center',gap:10,
            fontSize:14,fontWeight:800,color:DS.onSurface,
            letterSpacing:'0.01em',cursor:'pointer',
            fontFamily:'Plus Jakarta Sans,sans-serif',
            boxShadow:`0 1px 0 ${DS.ghostLine}`,
          }}>
            <Ico.Help c={DS.primary} sz={18}/>
            Report an issue
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── Snackbar ────────────────────────────────────────────── */
function Snack({msg}){
  return msg ? (
    <div style={{
      position:'absolute',bottom:24,left:16,right:16,zIndex:300,
      background:DS.onSurface,color:DS.surface,
      borderRadius:10,padding:'12px 16px',
      fontSize:13,fontWeight:600,
      animation:'fadeSlideUp 0.25s ease',
    }}>{msg}</div>
  ) : null;
}

/* ─── App ─────────────────────────────────────────────────── */
function App(){
  const [screen, setScreen] = React.useState('list');  // list | detail
  const [activeTrip, setActiveTrip] = React.useState(null);
  const [filter, setFilter] = React.useState('all');
  const [sheetOpen, setSheetOpen] = React.useState(false);
  const [dateRange, setDateRange] = React.useState('week');
  const [snack, setSnack] = React.useState(null);
  const snackT = React.useRef(null);

  const showSnack = (msg) => {
    if(snackT.current) clearTimeout(snackT.current);
    setSnack(msg);
    snackT.current = setTimeout(()=>setSnack(null), 2200);
  };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}>
      <AndroidDevice width={390} height={844} dark={false}>
        <div style={{
          height:'100%',position:'relative',overflow:'hidden',
          fontFamily:'Plus Jakarta Sans,sans-serif',
          background:DS.surface,
        }}>
          {screen==='list' && (
            <ListScreen
              filter={filter}
              dateRange={dateRange}
              onFilter={(id)=>{
                if(['all','delivered','cancelled','returned'].includes(id)){
                  setFilter(id);
                } else {
                  setSheetOpen(true);
                }
              }}
              onTripTap={(t)=>{ setActiveTrip(t); setScreen('detail'); }}
            />
          )}
          {screen==='detail' && activeTrip && (
            <DetailScreen
              trip={activeTrip}
              onBack={()=>setScreen('list')}
              onShowSnack={showSnack}
            />
          )}
          {/* Filter Sheet */}
          <FilterSheet
            open={sheetOpen}
            onClose={()=>setSheetOpen(false)}
            dateRange={dateRange}
            onDateRange={(r)=>{ setDateRange(r); showSnack(`Showing trips: ${r}`); }}
            onClear={()=>{ setDateRange('week'); setFilter('all'); showSnack('Filters cleared'); }}
          />
          {/* Filter trigger button (additional FAB-style) – removed; handled via header */}
          <Snack msg={snack}/>
        </div>
      </AndroidDevice>

      <div style={{
        position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',
        background:'rgba(255,255,255,0.07)',backdropFilter:'blur(12px)',
        borderRadius:20,padding:'8px 20px',
        fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.45)',
        letterSpacing:'0.05em',border:'1px solid rgba(255,255,255,0.1)',
        whiteSpace:'nowrap',
      }}>
        SHIPZY · TRIPS HISTORY · Tap a trip · Tap filter ⚲ for date sheet
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<div id="root"></div>
</body>
</html>
