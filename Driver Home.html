}

          width:80,height:80,borderRadius:40,
          border:`2px solid ${DS.primary}`,
          transform:'translate(-50%,-50%) scale(0.7)',
          animation:`radarPulse 2.2s ease-out ${i*0.7}s infinite`,
          opacity:0,

        position:'relative',zIndex:1,

/* ─── Swipe to Accept ─────────────────────────────────────── */
function SwipeAccept({onAccept}){
  const trackRef = React.useRef(null);
  const [pos, setPos] = React.useState(0);
  const [done, setDone] = React.useState(false);
  const dragging = React.useRef(false);
  const startX = React.useRef(0);
  const THUMB = 56, PADDING = 4;

  const getTrackWidth = () => (trackRef.current ? trackRef.current.offsetWidth : 300);

  const onPointerDown = (e) => {
    dragging.current = true;
    startX.current = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    e.preventDefault();
  };
  const onPointerMove = React.useCallback((e) => {
    if(!dragging.current) return;
    const x = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const delta = x - startX.current;
    const max = getTrackWidth() - THUMB - PADDING*2;
    setPos(Math.max(0, Math.min(delta, max)));
  }, []);
  const onPointerUp = React.useCallback(() => {
    if(!dragging.current) return;
    dragging.current = false;
    const max = getTrackWidth() - THUMB - PADDING*2;
    if(pos > max*0.75){
      setPos(max); setDone(true);
      setTimeout(()=>onAccept(), 400);
    } else { setPos(0); }
  }, [pos, onAccept]);

  React.useEffect(()=>{
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchmove', onPointerMove, {passive:true});
    window.addEventListener('touchend', onPointerUp);
    return ()=>{
      window.removeEventListener('mousemove', onPointerMove);
      window.removeEventListener('mouseup', onPointerUp);
      window.removeEventListener('touchmove', onPointerMove);
      window.removeEventListener('touchend', onPointerUp);
    };
  }, [onPointerMove, onPointerUp]);

  const max = 300 - THUMB - PADDING*2;
  const pct = pos/max;

  return (
    <div ref={trackRef} style={{
      position:'relative',height:56+PADDING*2,borderRadius:32,
      background: done ? DS.tertiary : DS.primaryLight,
      overflow:'hidden',
      transition:'background 0.3s',
      userSelect:'none',
    }}>
      {/* fill */}
      <div style={{
        position:'absolute',top:0,left:0,bottom:0,
        width:THUMB+PADDING+pos,
        background:DS.primaryGrad,borderRadius:32,
        transition: dragging.current ? 'none' : 'width 0.3s ease',
      }}/>
      {/* label */}
      <div style={{
        position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:14,fontWeight:700,letterSpacing:'0.03em',
        color: pct > 0.4 ? 'rgba(255,255,255,0.4)' : DS.primary,
        transition:'color 0.2s',
        pointerEvents:'none',
      }}>
        {done ? <Ico.Check c="#fff" sz={22}/> : 'Swipe to Accept →'}
      </div>
      {/* thumb */}
      {!done && (
        <div
          onMouseDown={onPointerDown}
          onTouchStart={onPointerDown}
          style={{
            position:'absolute',top:PADDING,left:PADDING+pos,
            width:THUMB,height:THUMB,borderRadius:28,
            background:'#fff',
            boxShadow:`0 2px 12px rgba(70,72,212,0.3)`,
            display:'flex',alignItems:'center',justifyContent:'center',
            cursor:'grab',
            transition: dragging.current ? 'none' : 'left 0.3s ease',
            zIndex:2,
          }}
        >
          <Ico.ArrowR sz={22} c={DS.primary}/>
        </div>
      )}
    </div>
  );
}

/* ─── Active Trip Card ────────────────────────────────────── */
function ActiveTripCard({phase, onNext}){

  const accentBg = isPickup ? DS.primaryLight : DS.errorBg;
  const nextLabel = isPickup ? 'Arrived at Pickup' : 'Complete Delivery';
  const nextGrad = isPickup ? DS.primaryGrad : `linear-gradient(135deg,#ba1a1a,#e05555)`;
  const stepLabel = isPickup ? 'HEAD TO PICKUP' : 'HEAD TO DROP';

  return (
    <div style={{
      position:'absolute',bottom:70,left:0,right:0,zIndex:40,
      animation:'slideUp 0.4s cubic-bezier(0.34,1.2,0.64,1)',
    }}>
      <div style={{
        margin:'0 12px',
        background:DS.surface,
        borderRadius:'20px 20px 0 0',
        boxShadow:`0 -8px 40px rgba(0,0,0,0.12)`,
        overflow:'hidden',
      }}>
        {/* colored top bar */}
        <div style={{
          background: isPickup ? DS.primaryGrad : `linear-gradient(135deg,#ba1a1a,#e05555)`,
          padding:'12px 20px',
          display:'flex',alignItems:'center',justifyContent:'space-between',
        }}>
          <div>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.08em',color:'rgba(255,255,255,0.75)',marginBottom:2}}>{stepLabel}</div>
            <div style={{fontSize:15,fontWeight:800,color:'#fff'}}>{isPickup ? ORDER.pickup.area : ORDER.delivery.area}</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.8)',fontWeight:500,marginTop:1}}>{isPickup ? ORDER.pickup.address : ORDER.delivery.address}</div>
          </div>
          {/* Navigate CTA */}
          <button style={{
            background:'rgba(255,255,255,0.2)',
            border:'none',borderRadius:12,
            padding:'10px 14px',cursor:'pointer',
            display:'flex',flexDirection:'column',
            alignItems:'center',gap:3,
          }}>
            <Ico.Nav c="#fff" sz={20}/>
            <span style={{fontSize:9,fontWeight:700,color:'#fff',letterSpacing:'0.05em'}}>NAVIGATE</span>
          </button>
        </div>

        <div style={{padding:'14px 20px 18px'}}>
          {/* Order info row */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            <div style={{
              width:36,height:36,borderRadius:10,
              background:accentBg,
              display:'flex',alignItems:'center',justifyContent:'center',
              flexShrink:0,
            }}>
              <Ico.Pkg c={accentColor} sz={16}/>
            </div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:DS.onSurface}}>{ORDER.orderNumber} · {ORDER.package.type}</div>
              <div style={{fontSize:11,color:DS.onSurfaceVar,fontWeight:500}}>{ORDER.package.weight} · {ORDER.distanceKm} km total</div>
            </div>
            <div style={{fontSize:15,fontWeight:800,color:DS.primary}}>₹134</div>
          </div>

            padding:'10px 14px',marginBottom:14,
          }}>
            <Avatar size={34}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:DS.onSurface}}>{ORDER.customer.name}</div>
              <div style={{fontSize:11,color:DS.onSurfaceVar,fontWeight:500}}>{ORDER.customer.phone}</div>

              display:'flex',alignItems:'center',justifyContent:'center',
              boxShadow:`0 3px 10px rgba(0,108,73,0.35)`,
            }}>

            letterSpacing:'0.02em',

/* ─── Bottom Nav ──────────────────────────────────────────── */

  const tabs = [
    {id:'home', label:'Home', Icon:Ico.Home},
    {id:'earnings', label:'Earnings', Icon:Ico.Earnings},
    {id:'trips', label:'Trips', Icon:Ico.Trips},
    {id:'profile', label:'Profile', Icon:Ico.Profile},
  ];
  return (
    <div style={{
      position:'absolute',bottom:0,left:0,right:0,zIndex:50,
      background:'rgba(252,248,255,0.96)',
      backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
      borderTop:`1px solid ${DS.surfaceHigh}`,
      display:'flex',height:70,paddingBottom:8,
    }}>
      {tabs.map(({id,label,Icon})=>{
        const isActive = id===active;
        return (
          <div key={id} style={{

              color: isActive ? DS.primary : DS.onSurfaceVar,

          </div>
        );
      })}

  );
}

/* ─── Snackbar ────────────────────────────────────────────── */
function Snack({msg}){
  return msg ? (
    <div style={{
      position:'absolute',bottom:84,left:16,right:16,zIndex:60,
      background:DS.onSurface,color:DS.surface,
      borderRadius:10,padding:'12px 16px',
      fontSize:13,fontWeight:600,
      animation:'floatUp 2.5s ease forwards',
    }}>{msg}</div>
  ) : null;
}

/* ─── State Label Chip ────────────────────────────────────── */
function StateChip({label,color,onNext,onPrev,stateIdx,total}){
  return (
    <div style={{
      position:'absolute',top:0,left:0,right:0,zIndex:100,
      display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'6px 8px',
      background:'rgba(27,27,35,0.85)',
      backdropFilter:'blur(8px)',
    }}>
      <button onClick={onPrev} disabled={stateIdx===0} style={{
        width:28,height:28,borderRadius:6,border:'none',
        background:stateIdx===0?'transparent':'rgba(255,255,255,0.15)',
        color:'#fff',fontSize:14,cursor:stateIdx===0?'default':'pointer',
        display:'flex',alignItems:'center',justifyContent:'center',
        opacity:stateIdx===0?0.3:1,
      }}>‹</button>
      <div style={{display:'flex',alignItems:'center',gap:7}}>
        <div style={{width:6,height:6,borderRadius:3,background:color}}/>
        <span style={{fontSize:10,fontWeight:700,color:'rgba(255,255,255,0.85)',letterSpacing:'0.06em'}}>{label}</span>
        <span style={{fontSize:10,color:'rgba(255,255,255,0.4)',fontWeight:500}}>{stateIdx+1}/{total}</span>
      </div>
      <button onClick={onNext} disabled={stateIdx===total-1} style={{
        width:28,height:28,borderRadius:6,border:'none',
        background:stateIdx===total-1?'transparent':'rgba(255,255,255,0.15)',
        color:'#fff',fontSize:14,cursor:stateIdx===total-1?'default':'pointer',
        display:'flex',alignItems:'center',justifyContent:'center',
        opacity:stateIdx===total-1?0.3:1,
      }}>›</button>
    </div>
  );
}

/* ─── Main App ────────────────────────────────────────────── */
const STATES = [
  {key:'offline',  label:'OFFLINE',        color:'#9c9ca8'},
  {key:'searching',label:'ONLINE — SEARCHING', color:'#00a86b'},
  {key:'request',  label:'INCOMING REQUEST',color:'#4648d4'},
  {key:'pickup',   label:'ACTIVE — TO PICKUP', color:'#4648d4'},
  {key:'drop',     label:'ACTIVE — TO DROP', color:'#ba1a1a'},
];

function App(){
  const stored = ()=>{ try{ return parseInt(localStorage.getItem('shipzy_home_state')||'0'); }catch{return 0;} };
  const [si, setSi] = React.useState(stored);
  const [snack, setSnack] = React.useState(null);
  const snackT = React.useRef(null);

  const goState = (i) => {
    setSi(i);
    localStorage.setItem('shipzy_home_state', i);
  };

  const showSnack = (msg) => {
    if(snackT.current) clearTimeout(snackT.current);
    setSnack(msg);
    snackT.current = setTimeout(()=>setSnack(null), 2500);
  };

  const state = STATES[si].key;
  const isOnline = state !== 'offline';

  const handleToggle = () => {
    if(state==='offline') goState(1);
    else { goState(0); showSnack('You are now Offline'); }
  };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}>
      <AndroidDevice width={390} height={844} dark={false}>
        <div style={{
          height:'100%',position:'relative',overflow:'hidden',
          fontFamily:'Plus Jakarta Sans,sans-serif',
          background:DS.surface,
        }}>
          {/* State nav chip (dev tool) */}
          <StateChip
            label={STATES[si].label} color={STATES[si].color}
            stateIdx={si} total={STATES.length}
            onNext={()=>goState(Math.min(si+1,STATES.length-1))}
            onPrev={()=>goState(Math.max(si-1,0))}
          />

          {/* Map background */}
          <div style={{position:'absolute',top:28,left:0,right:0,bottom:0}}>
            <CityMap isOnline={isOnline}/>
            {(state==='searching') && <RadarPulse/>}
          </div>

          {/* Header */}
          <div style={{paddingTop:28}}>
            <Header/>
          </div>

          {/* Stats Banner */}
          <div style={{paddingTop:28}}>
            <StatsBanner isOnline={isOnline}/>
          </div>

          {/* Offline overlay text */}
          {state==='offline' && (
            <div style={{
              position:'absolute',top:'44%',left:0,right:0,
              display:'flex',flexDirection:'column',alignItems:'center',
              gap:8,animation:'fadeIn 0.4s ease',
            }}>
              <div style={{
                fontSize:13,fontWeight:700,color:DS.onSurfaceVar,
                letterSpacing:'0.04em',
                background:'rgba(252,248,255,0.88)',
                backdropFilter:'blur(12px)',
                borderRadius:20,padding:'8px 18px',
              }}>You're currently offline</div>
            </div>
          )}

          {/* Request Card */}
          {state==='request' && (
            <RequestCard
              onAccept={()=>goState(3)}
              onDecline={()=>{goState(1); showSnack('Order declined');}}
            />
          )}

          {/* Active Trip Cards */}
          {state==='pickup' && <ActiveTripCard phase="pickup" onNext={()=>goState(4)}/>}
          {state==='drop' && <ActiveTripCard phase="drop" onNext={()=>{goState(1); showSnack('Delivery completed! ₹134 earned 🎉');}}/>}

          {/* Online toggle — hide during active order */}
          {(state==='offline'||state==='searching') && (
            <OnlineToggle isOnline={isOnline} onToggle={handleToggle}/>
          )}

          {/* Searching pill */}
          {state==='searching' && <SearchingPill/>}

          {/* Simulate incoming */}
          {state==='searching' && (
            <button onClick={()=>goState(2)} style={{
              position:'absolute',bottom:156,right:16,zIndex:25,
              background:DS.surface,border:`1.5px solid ${DS.surfaceHigh}`,
              borderRadius:10,padding:'8px 12px',cursor:'pointer',
              fontSize:10,fontWeight:700,color:DS.primary,
              letterSpacing:'0.05em',
              boxShadow:`0 2px 8px rgba(70,72,212,0.15)`,
              fontFamily:'Plus Jakarta Sans,sans-serif',
            }}>SIM ORDER ↑</button>
          )}

          {/* Snackbar */}
          <Snack msg={snack}/>

          {/* Bottom Nav */}
          <BottomNav active="home"/>
        </div>
      </AndroidDevice>

      {/* Footer label */}
      <div style={{
        position:'fixed',bottom:20,left:'50%',transform:'translateX(-50%)',
        background:'rgba(255,255,255,0.07)',backdropFilter:'blur(12px)',
        borderRadius:20,padding:'8px 20px',
        fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.45)',
        letterSpacing:'0.05em',border:'1px solid rgba(255,255,255,0.1)',
        whiteSpace:'nowrap',
      }}>
        SHIPZY · DRIVER HOME · Use ‹ › to switch states
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<div id="root"></div>
</body>
